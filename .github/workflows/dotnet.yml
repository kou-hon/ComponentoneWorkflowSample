name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read

    steps:
    # 1. 前回実行のartifactを検索してダウンロード
    - name: Download last_build_date artifact from previous workflow
      id: download_artifact
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 取得対象artifact名
        $artifactName = "last_build_date"
        $repo = "${{ github.repository }}"

        # アーティファクト一覧を取得
        $artifacts = gh api "repos/$repo/actions/artifacts" --paginate | ConvertFrom-Json

        # 一致するartifactを探す
        $target = $artifacts.artifacts | Where-Object { $_.name -eq $artifactName } | Sort-Object created_at -Descending | Select-Object -First 1

        if ($null -ne $target) {
          Write-Host "Found artifact: $($target.name)"
          $artifactId = $target.id

          # zipをダウンロードして展開
          gh api "repos/$repo/actions/artifacts/$artifactId/zip" > artifact.zip
          if (Test-Path artifact.zip) {
            Expand-Archive artifact.zip -DestinationPath .
            Write-Host "Artifact downloaded and extracted."
          } else {
            Write-Host "artifact.zip not found. Download failed."
          }
        }
        else {
          Write-Host "No previous artifact found."
        }

    # 2. 今日の日付を取得
    - name: Get today's date
      id: get_date
      shell: pwsh
      run: |
        $date = Get-Date -Format "yyyy-MM-dd"
        echo "date=$date" >> $env:GITHUB_ENV

    # 3. 前回実行日と比較
    - name: Compare dates
      id: compare
      shell: pwsh
      run: |
        if (Test-Path .\last_build_date.txt) {
          $LAST_RUN_DATE = Get-Content .\last_build_date.txt
          Write-Host "Last run date: $LAST_RUN_DATE"
        } else {
          $LAST_RUN_DATE = ""
          Write-Host "No last_build_date.txt found."
        }

        if ($LAST_RUN_DATE -eq $env:date) {
          echo "skip=true" >> $env:GITHUB_ENV
          Write-Host "Already run today. Skipping build."
        } else {
          echo "skip=false" >> $env:GITHUB_ENV
          Write-Host "Not run today. Proceeding with build."
        }

    # 4. ワークフロー本体
    - name: Checkout
      if: env.skip == 'false'
      uses: actions/checkout@v4

    - name: Setup .NET
      if: env.skip == 'false'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Download grape city gclm_deploy.exe
      if: env.skip == 'false'
      run: |
        curl -o gclm_deploy.exe https://cdn.mescius.com/license/gclm_deploy.exe

    - name: grape city licene manager install
      if: env.skip == 'false'
      run: |
        .\gclm_deploy.exe | Write-Host
        if (Test-Path "C:\ProgramData\GrapeCity\gclm\gclm.exe") {
          Write-Host "gclm.exe is present."
        } else {
          Write-Error "gclm.exe is NOT present!"
          Get-ChildItem "C:\ProgramData\GrapeCity\gclm"
        }
        
    - name: gclm setting
      if: env.skip == 'false'
      env:
        LICENSE_KEY: ${{ secrets.COMPONENTONEKEY }}
      run: |
        pwsh -File .github/scripts/activate-license.ps1

    - name: Restore dependencies
      if: env.skip == 'false'
      run: dotnet restore

    - name: Build
      if: env.skip == 'false'
      run: dotnet build --no-restore

    - name: Test
      if: env.skip == 'false'
      run: dotnet test --no-build --verbosity normal

    # 5. 今日の日付をartifactとして保存
    - name: Save today's date as artifact
      if: env.skip == 'false'
      shell: pwsh
      run: |
        $env:date | Out-File -Encoding UTF8 -NoNewline last_build_date.txt

    - name: Upload last_build_date artifact
      if: env.skip == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: last_build_date
        path: last_build_date.txt
        retention-days: 3

    # 6. クリーンアップ
    - name: clean up
      if: always() && env.skip != 'true'
      run: |
        & "C:\ProgramData\GrapeCity\gclm\gclm.exe" 4327eaf8-aa02-40a6-b9f6-3d007c039055 -d
